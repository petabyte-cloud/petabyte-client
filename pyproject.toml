# The `petabyte` CLI — the public, MIT-licensed client for the Petabyte GPU marketplace.
#
# GENERATED from the main repo by scripts/build_cli_package.py — do not hand-edit here; edit the
# source (lumaris_api/cli/petabyte.py + lumaris_api/modelhub/) in the main repo and let the mirror
# regenerate this. Flat layout: petabyte.py + modelhub/ live at the repo root.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petabyte-client"
version = "0.4.1"
description = "Petabyte CLI — rent verified GPU compute, launch apps, and pull AI models from your terminal."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Petabyte, Inc." }]
keywords = ["gpu", "compute", "cloud", "marketplace", "cli", "ai", "models", "mcp"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.24", "rich>=13.0", "tqdm>=4.66"]

[project.optional-dependencies]
system = ["psutil>=5.9"]
# MCP server (`petabyte-mcp`). The mcp SDK needs Python 3.12+, so it is opt-in only and never
# raises the base CLI's 3.9 floor. httpx is already a base dep; pinned >=0.27 here for the SDK.
mcp = ["mcp>=2.1,<3", "httpx>=0.27", "pydantic>=2.0"]

[project.urls]
Homepage = "https://petabyte.market"
Documentation = "https://petabyte.market/wiki"
Source = "https://github.com/petabyte-cloud/petabyte-client"

[project.scripts]
petabyte = "petabyte:main"
petabyte-mcp = "petabyte_mcp.__main__:run"

[tool.setuptools]
py-modules = ["petabyte"]
packages = ["petabyte_cli", "modelhub", "modelhub.providers", "petabyte_mcp"]
license-files = ["LICENSE"]
